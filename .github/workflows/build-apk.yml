name: APK bauen

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: APK bauen
        run: |
          SETTINGS=$(find . -name settings.gradle -not -path "./.git/*" | head -1)
          cd "$(dirname "$SETTINGS")"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle assembleRelease --no-daemon

      - name: APK einsammeln
        run: |
          mkdir -p "$RUNNER_TEMP/apk"
          find . -path "*/build/outputs/apk/release/*.apk" -exec cp {} "$RUNNER_TEMP/apk/Streckenkilometer.apk" \;
          ls -la "$RUNNER_TEMP/apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Streckenkilometer-APK
          path: ${{ runner.temp }}/apk/*.apk
          include-hidden-files: true
