plugins {
    id 'com.android.application'
}

android {
    namespace 'de.streckenkm.hamburgsued'
    compileSdk 35

    defaultConfig {
        applicationId 'de.streckenkm.hamburgsued'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    signingConfigs {
        release {
            storeFile file('release.keystore')
            storePassword 'strecken123'
            keyAlias 'strecken'
            keyPassword 'strecken123'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // index.html nicht komprimieren (schnelleres Laden)
    androidResources {
        noCompress 'html'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.12.1'
}
